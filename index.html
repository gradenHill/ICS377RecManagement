<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Parks & Recreation - Activities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" width="auto" height="40" class="me-2">
            </a>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item"><a class="nav-link active border-bottom border-dark border-3" href="index.html">ACTIVITIES</a></li>
                    <li class="nav-item"><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-4">
                <a href="account.html" id="main-nav-link" class="text-decoration-none text-dark fw-bold">ACCOUNT</a>
                <a href="cart.html" class="text-dark position-relative">
                    <i class="bi bi-cart3 fs-4"></i>
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <div class="input-group mb-4 shadow-sm border rounded-pill bg-white overflow-hidden">
            <span class="input-group-text bg-white border-0 ps-4"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="search-input" class="form-control border-0 py-3" placeholder="Search activities (e.g., 'Volleyball')..." aria-label="Search activities">
            <button id="clear-search-btn" class="btn bg-white border-0 d-none text-muted" type="button">
                <i class="bi bi-x-circle-fill"></i>
            </button>
            <button class="btn btn-dark px-5 fw-bold" type="button" id="search-btn">Search</button>
        </div>

        <div class="row">
            <aside class="col-md-2">
                <div id="filter-sidebar" class="card border-0 bg-transparent">
                    </div>
            </aside>

            <main class="col-md-10">
                <ul class="nav nav-pills mb-4 gap-2" id="catalog-tabs"></ul>

                <div id="activity-list" class="d-flex flex-column gap-3">
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Select a Family Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="modal-activity-info" class="text-muted mb-4 small"></p>
                    <div id="member-selection-list" class="d-flex flex-column gap-2">
                        <div class="text-center py-3 text-muted">Loading household...</div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light w-100 py-2" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Item added to cart successfully!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="modal"></button>
            </div>
        </div>
    </div>
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Sign In Required</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <i class="bi bi-person-lock fs-1 text-muted mb-3"></i>
                    <p class="mb-4">You need to sign in first to add activities to your cart and assign family members.</p>
                    <div class="d-flex flex-column gap-2">
                        <button id="login-sim-btn" class="btn btn-dark py-3 rounded-pill fw-bold">Log In</button>
                        <a href="signup.html" class="btn btn-outline-dark py-3 rounded-pill fw-bold">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
