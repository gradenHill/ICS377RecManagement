<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Valley Parks & Recreation - Activities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="site-header navbar navbar-expand-lg">
        <div class="header-container">
            <a class="brand-logo" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" height="40">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse center-nav" id="navbarNav">
                <ul class="nav-links">
                    <li><a class="nav-link active" href="index.html">ACTIVITIES</a></li>
                    <li><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>

            <div class="user-actions">
                <a href="account.html" id="main-nav-link" class="account-link">ACCOUNT</a>
                <a href="cart.html" class="cart-link">
                    <i class="bi bi-cart3 cart-icon"></i>
                    <span id="cart-badge" class="cart-badge d-none">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        
        <div class="search-wrapper">
            <span class="search-icon"><i class="bi bi-search"></i></span>
            <input type="text" id="search-input" class="search-input" placeholder="Search activities (e.g., 'Volleyball')..." aria-label="Search activities">
            <button id="clear-search-btn" class="clear-btn d-none" type="button">
                <i class="bi bi-x-circle-fill"></i>
            </button>
            <button class="btn-search" type="button" id="search-btn">Search</button>
        </div>

        <div class="layout-grid">
            <aside class="sidebar">
                <div id="filter-sidebar">
                    <h6 class="filter-title">Filters</h6>
                    <div id="filter-content"></div>
                </div>
            </aside>

            <main class="main-content">
                <ul class="catalog-tabs" id="catalog-tabs"></ul>
                <div id="activity-list" class="activity-list"></div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="memberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal">
                <div class="custom-modal-header">
                    <h5 class="custom-modal-title">Select a Family Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="custom-modal-body">
                    <p id="modal-activity-info" class="modal-subtitle"></p>
                    <div id="member-selection-list" class="member-list">
                        <div class="loading-text">Loading household...</div>
                    </div>
                </div>
                <div class="custom-modal-footer">
                    <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal text-center">
                <div class="custom-modal-header border-0">
                    <h5 class="custom-modal-title">Sign In Required</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="custom-modal-body auth-body">
                    <i class="bi bi-person-lock auth-icon"></i>
                    <p class="auth-desc">You need to sign in first to add activities to your cart and assign family members.</p>
                    <div class="auth-actions">
                        <button id="login-sim-btn" class="btn-primary">Log In</button>
                        <a href="signup.html" class="btn-secondary">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container custom-toast-container">
        <div id="cartToast" class="toast custom-toast" role="alert">
            <div class="toast-content">
                <div class="toast-message">Item added to cart successfully!</div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
