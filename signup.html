<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Apple Valley Parks & Rec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="p-4 d-flex justify-content-center bg-white border-bottom" style="border-top: 4px solid #0284c7;">
        <a class="text-decoration-none d-flex align-items-center" href="index.html">
            <img src="/img/AVLogo.png" alt="Logo" height="40">
        </a>
    </header>

    <div class="container d-flex justify-content-center align-items-center flex-column" style="min-height: 80vh; padding: 3rem 1rem;">
        
        <div class="signup-card p-5 mb-4">
            <h2 class="text-center fw-bold mb-4" style="color: #0f172a;">Sign Up</h2>
            
            <form id="signup-form">
                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Name</label>
                    <input type="text" class="form-control form-control-custom" placeholder="John Doe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Age</label>
                    <input type="number" class="form-control form-control-custom" placeholder="38" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold d-block text-secondary">Gender</label>
                    <div class="d-flex gap-4 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female" checked>
                            <label class="form-check-label fw-medium text-secondary" for="female">Female</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                            <label class="form-check-label fw-medium text-secondary" for="male">Male</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="non-binary" value="non-binary">
                            <label class="form-check-label fw-medium text-secondary" for="non-binary">Non-Binary</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-secondary">Email</label>
                    <input type="email" class="form-control form-control-custom" placeholder="john.doe@gmail.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-secondary">Password</label>
                    <input type="password" class="form-control form-control-custom" placeholder="**********" required>
                </div>

                <button type="submit" class="btn-primary w-100 py-3 mt-2">Create Account</button>
            </form>
        </div>

        <p class="text-center text-secondary fw-medium" style="font-size: 0.95rem;">
            Already have an account? 
            <a href="#" id="login-info-link" style="color: #0284c7; text-decoration: none; font-weight: 700; transition: color 0.2s;">Log In</a>
        </p>

    </div>

    <div class="modal fade" id="prototypeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal text-center">
                <div class="custom-modal-header border-0 pb-0 justify-content-center position-relative">
                    <h5 class="custom-modal-title">Login Information Not Yet Stored</h5>
                    <button type="button" class="btn-close position-absolute end-0 me-4" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="custom-modal-body p-4">
                    <p class="mb-4 text-secondary lh-lg">
                        This is a High-Fidelity Prototype. Permanent accounts don't exist yet. Create a temporary account to test the prototype!
                    </p>
                    <button type="button" class="btn-primary w-100 py-3" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
