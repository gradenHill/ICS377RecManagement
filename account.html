<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Apple Valley Parks & Rec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="site-header navbar navbar-expand-lg">
        <div class="header-container">
            <a class="brand-logo" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" height="40">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse center-nav" id="navbarNav">
                <ul class="nav-links">
                    <li><a class="nav-link" href="index.html">ACTIVITIES</a></li>
                    <li><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>

            <div class="user-actions">
                <a href="account.html" id="main-nav-link" class="account-link active">ACCOUNT</a>
                <a href="cart.html" class="cart-link">
                    <i class="bi bi-cart3 cart-icon"></i>
                    <span id="cart-badge" class="cart-badge d-none">0</span>
                </a>
            </div>
        </div>
    </nav>


    <div class="page-container">
        <div class="row gx-5">
            
            <div class="col-lg-6 mb-5 mb-lg-0">
                <h2 class="fw-bold mb-4" style="color: #0f172a;">Family Members</h2>
                
                <div id="members-list"></div>
                
                <div class="d-flex flex-wrap gap-3 mt-4">
                    <button id="open-add-member" class="btn-primary">Add Family Member</button>
                    <button id="sign-out-btn" class="btn-danger-outline">Sign Out</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="mb-5">
                    <h2 class="fw-bold mb-3" style="color: #0f172a;">Address</h2>
                    <div class="info-card">
                        <p id="address-display" class="fs-5 mb-0 text-secondary flex-grow-1">No address provided</p>
                        <button id="edit-address-btn" class="btn-secondary">Edit</button>
                    </div>
                </div>

                <div>
                    <h2 class="fw-bold mb-3" style="color: #0f172a;">Payment Methods</h2>
                    <div class="info-card">
                        <i class="bi bi-credit-card-2-front fs-3" style="color: #0284c7;"></i>
                        <p class="fs-5 mb-0 flex-grow-1 text-secondary">Mastercard ending in 4567</p>
                        <button id="add-payment-btn" class="btn-secondary">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addMemberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal">
                <div class="custom-modal-header">
                    <h5 class="custom-modal-title">Add Household Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="custom-modal-body">
                    <form id="add-member-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Full Name</label>
                            <input type="text" id="new-member-name" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold text-secondary">Age</label>
                            <input type="number" id="new-member-age" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block text-secondary">Gender</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-female" value="Female">
                                    <label class="form-check-label fw-medium text-secondary" for="g-female">Female</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-male" value="Male" checked>
                                    <label class="form-check-label fw-medium text-secondary" for="g-male">Male</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-other" value="Non-Binary">
                                    <label class="form-check-label fw-medium text-secondary" for="g-other">Non-Binary</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary w-100 py-3 mt-2">Save Family Member</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal">
                <div class="custom-modal-header">
                    <h5 class="custom-modal-title">Update Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="custom-modal-body">
                    <form id="edit-address-form">
                        <div class="mb-4">
                            <label class="form-label fw-bold text-secondary">Street Address</label>
                            <input type="text" id="input-address" class="form-control form-control-custom" placeholder="e.g. 123 Apple Way" required>
                        </div>
                        <button type="submit" class="btn-primary w-100 py-3">Save Address</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
