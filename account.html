<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Apple Valley Parks & Rec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .member-card {
            border: 1px solid #000;
            border-radius: 1rem;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-dark-rounded {
            background-color: #2d2f3b;
            color: white;
            border-radius: 0.75rem;
            padding: 0.5rem 1.5rem;
            border: none;
            font-weight: 500;
        }
        .btn-dark-rounded:hover {
            background-color: #1a1c24;
            color: white;
        }
        .form-control-custom {
            background-color: #f8f9fa;
            border-radius: 0.75rem;
            border: 1px solid #ced4da;
            padding: 0.6rem 1rem;
        }
    </style>
</head>
<body class="bg-white">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" width="auto" height="40" class="me-2">
            </a>
            <div class="collapse navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">ACTIVITIES</a></li>
                    <li class="nav-item"><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-4">
                <a href="account.html" id="main-nav-link" class="text-decoration-none text-dark fw-bold border-bottom border-dark border-3">ACCOUNT</a>
                <a href="cart.html" class="text-dark position-relative">
                    <i class="bi bi-cart3 fs-4"></i>
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row gx-5">
            <div class="col-md-6">
                <h2 class="fw-bold mb-4">Family Members</h2>
                <div id="members-list"></div>
                
                <div class="d-flex gap-2 mt-3">
                    <button id="open-add-member" class="btn btn-dark-rounded">Add Family Member</button>
                    <button id="sign-out-btn" class="btn btn-outline-danger rounded-3 px-4">Sign Out</button>
                </div>
            </div>

            <div class="col-md-6">
                <div class="mb-5">
                    <h2 class="fw-bold mb-3">Address</h2>
                    <div class="d-flex align-items-start gap-3">
                        <p id="address-display" class="fs-5 mb-0 text-muted">No address provided</p>
                        <button id="edit-address-btn" class="btn btn-dark-rounded btn-sm">Edit</button>
                    </div>
                </div>

                <div>
                    <h2 class="fw-bold mb-3">Payment Methods</h2>
                    <p class="fs-5 mb-3">Mastercard ending in 4567</p>
                    <button id="add-payment-btn" class="btn btn-dark-rounded">Add Payment Method</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addMemberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold fs-4">Add Household Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="add-member-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="new-member-name" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Age</label>
                            <input type="number" id="new-member-age" class="form-control form-control-custom" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block">Gender</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-female" value="Female">
                                    <label class="form-check-label" for="g-female">Female</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-male" value="Male" checked>
                                    <label class="form-check-label" for="g-male">Male</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="new-gender" id="g-other" value="Non-Binary">
                                    <label class="form-check-label" for="g-other">Non-Binary</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-pill shadow">Save Family Member</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addressModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Update Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="edit-address-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Street Address</label>
                            <input type="text" id="input-address" class="form-control form-control-custom" placeholder="e.g. 123 Apple Way" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold">Save Address</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
