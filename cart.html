<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Apple Valley Parks & Rec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" width="auto" height="40" class="me-2">
            </a>
            <div class="collapse navbar-collapse justify-content-center">
                <ul class="navbar-nav gap-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">ACTIVITIES</a></li>
                    <li class="nav-item"><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center gap-4">
                <a href="account.html" id="main-nav-link" class="text-decoration-none text-dark fw-bold">ACCOUNT</a>
                <a href="cart.html" class="text-dark position-relative">
                    <i class="bi bi-cart3 fs-4"></i>
                    <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size: 0.6rem;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8">
                <div class="mb-4">
                    <a href="index.html" class="btn btn-link text-dark text-decoration-none p-0">
                        <i class="bi bi-arrow-left me-2"></i>Continue Browsing
                    </a>
                </div>

                <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
                
                <div id="cart-items-list" class="d-flex flex-column gap-3">
                    </div>

            </div>

            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 20px;">
                    <h5 class="fw-bold mb-4">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4">
                        <span>Processing Fee</span>
                        <span>$0.00</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fw-bold fs-5">Total</span>
                        <span id="cart-total" class="fw-bold fs-5 text-success">$0.00</span>
                    </div>
                    <button id="checkout-btn" class="btn btn-dark w-100 py-3 fw-bold rounded-pill shadow">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>
</body>
</html>
