<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Apple Valley Parks & Rec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="site-header navbar navbar-expand-lg">
        <div class="header-container">
            <a class="brand-logo" href="index.html">
                <img src="/img/AVLogo.png" alt="Logo" height="40">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse center-nav" id="navbarNav">
                <ul class="nav-links">
                    <li><a class="nav-link" href="index.html">ACTIVITIES</a></li>
                    <li><a class="nav-link" href="rentals.html">RENTALS</a></li>
                </ul>
            </div>

            <div class="user-actions">
                <a href="account.html" id="main-nav-link" class="account-link">ACCOUNT</a>
                <a href="cart.html" class="cart-link" style="color: #0284c7;">
                    <i class="bi bi-cart3 cart-icon"></i>
                    <span id="cart-badge" class="cart-badge d-none">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="row gx-5">
            <div class="col-lg-8 mb-5 mb-lg-0">
                <div class="mb-4">
                    <a href="index.html" class="back-link">
                        <i class="bi bi-arrow-left me-2"></i>Continue Browsing
                    </a>
                </div>

                <h2 class="fw-bold mb-4" style="color: #0f172a;">Your Shopping Cart</h2>
                
                <div id="cart-items-list" class="activity-list">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-card sticky-top" style="top: 20px;">
                    <h5 class="fw-bold mb-4" style="color: #0f172a;">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-3 text-secondary fw-medium">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-4 text-secondary fw-medium">
                        <span>Processing Fee</span>
                        <span>$0.00</span>
                    </div>
                    <hr style="border-color: #e2e8f0;">
                    <div class="d-flex justify-content-between mb-4 mt-3">
                        <span class="fw-bold fs-5" style="color: #0f172a;">Total</span>
                        <span id="cart-total" class="fw-bold fs-5 total-price">$0.00</span>
                    </div>
                    <button id="checkout-btn" class="btn-primary w-100 py-3">
                        Proceed to Checkout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
